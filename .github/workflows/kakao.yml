name: 카카오톡 연결·보내기

on:
  workflow_dispatch:  # Actions 탭(또는 GitHub 앱)에서 실행
    inputs:
      code:
        description: "처음 연결할 때만: 연결 페이지(/kakao/)에서 받은 인증 코드. 비우면 오늘 게시글을 카톡으로 다시 보냄"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mail
  cancel-in-progress: false

jobs:
  kakao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install cryptography

      - name: 카카오 연결 또는 보내기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_TOKEN_KEY: ${{ secrets.KAKAO_TOKEN_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |  # 코드는 실행 기록에 찍히지 않게 이벤트 파일에서 직접 읽는다
          CODE=$(jq -r '.inputs.code // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$CODE" ]; then
            echo "::add-mask::$CODE"
            python kakao_send.py --setup "$CODE"
          else
            python kakao_send.py
          fi

      - name: 토큰 파일 저장
        run: |
          git config user.name "sudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data/kakao_token.enc data/kakaoed; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "카카오 토큰 갱신 (암호화)"
            git pull --rebase
            git push
          fi
