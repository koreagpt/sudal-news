name: 수달일보 발행

on:
  schedule:
    - cron: "30 21 * * *"  # 매일 06:30 (한국 시간). GitHub 사정에 따라 수십 분 늦어질 수 있음
  workflow_dispatch:       # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "full = 뉴스 새로 수집, build = 페이지만 다시 생성"
        default: full
        type: choice
        options: [full, build]
  push:                    # 웹툰·디자인을 바꿔 올리면 페이지만 다시 생성
    branches: [main]
    paths: ["data/webtoons/**", "data/webtoons.json", "static/**", "newsbot/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지·한글 글꼴 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - id: pages
        uses: actions/configure-pages@v5

      - name: 뉴스 수집·페이지 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.mode }}" = "build" ]; then
            python daily.py --build-only
          else
            python daily.py
          fi

      - name: 오늘 뉴스 기록 저장
        if: github.event_name != 'push' && inputs.mode != 'build'
        run: |
          git config user.name "sudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if ! git diff --cached --quiet; then
            git commit -m "수달일보 $(TZ=Asia/Seoul date +%F) 발행"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
