name: 수달일보 발행
run-name: "수달일보 발행 · ${{ inputs.mode || github.event_name }}"  # 메일·카톡이 어떤 실행 뒤인지 알아보는 데 쓴다

on:
  schedule:  # GitHub 예약은 2~3시간씩 늦거나 빠질 수 있어 새벽부터 여러 번 건다. 9시 전에 묶음을 끝내는 게 목표
    # 먼저 돈 한 번이 발행하고, 나머지는 건너뛴다 (웹툰이 아직 없으면 웹툰만 다시 만든다)
    - cron: "13 19 * * *"  # 04:13 (한국 시간)
    - cron: "13 20 * * *"  # 05:13
    - cron: "13 21 * * *"  # 06:13
    - cron: "43 21 * * *"  # 06:43
    - cron: "13 22 * * *"  # 07:13
    - cron: "43 22 * * *"  # 07:43
    - cron: "13 23 * * *"  # 08:13
    - cron: "13 0 * * *"   # 09:13 (여기부터는 웹툰이 그때까지 안 됐을 때만 일함)
    - cron: "13 1 * * *"   # 10:13
    - cron: "13 3 * * *"   # 12:13
  workflow_dispatch:       # Actions 탭(또는 GitHub 앱)에서 수동 실행
    inputs:
      mode:
        description: "full = 뉴스+웹툰 새로, webtoon = 웹툰만 다시, build = 페이지만 다시, castsheet = 조연 기준 시트 새로, webtoontest = 웹툰 시험(게시 안 함), ad = 강의 카드만 다시, charsheet = 새 사원 캐릭터 시안 그리기(게시 안 함), redraw = 지난 웹툰 그림만 다시(topic에 날짜들), scripttest = 대본만 글로 시험(그림 없음)"
        default: full
        type: choice
        options: [full, webtoon, build, castsheet, webtoontest, ad, charsheet, redraw, scripttest]
      host:
        description: "webtoontest일 때만: 시험해 볼 당번 (auto = 오늘 당번)"
        required: false
        default: auto
        type: choice
        options: [auto, dalmong, nyaong, mungmung]
      topic:
        description: "웹툰 소재로 쓸 뉴스 번호 (비우면 AI가 고름). charsheet일 때는 시안 id (비우면 전부), redraw일 때는 날짜들 (예: 2026-10-20 2026-10-21)"
        required: false
        default: ""
  push:                    # 웹툰·디자인을 바꿔 올리면 페이지만 다시 생성
    branches: [main]
    paths: ["data/webtoons/**", "data/webtoons.json", "data/hosts.json", "static/**", "newsbot/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지·한글 글꼴 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - id: pages
        uses: actions/configure-pages@v5

      - name: 뉴스·웹툰·페이지 생성
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          MODE: ${{ github.event_name == 'push' && 'build' || github.event_name == 'schedule' && 'scheduled' || inputs.mode || 'full' }}
          TOPIC: ${{ inputs.topic }}
          HOST_TEST: ${{ inputs.mode == 'webtoontest' && inputs.host != 'auto' && inputs.host || '' }}
        run: |
          case "$MODE" in
            build)   python daily.py --build-only ;;
            webtoon) python daily.py --webtoon-only ${TOPIC:+--topic "$TOPIC"} ;;
            castsheet) python daily.py --cast-sheet ;;
            webtoontest) python daily.py --webtoon-only --no-save ${TOPIC:+--topic "$TOPIC"} ;;
            ad) python daily.py --ad-only ;;
            charsheet) python make_character.py $TOPIC && python daily.py --build-only ;;
            redraw) python daily.py --redraw $TOPIC ;;
            scripttest) python daily.py --script-only ${TOPIC:+--topic "$TOPIC"} && python daily.py --build-only ;;
            scheduled) python daily.py --if-missing ;;
            *)       python daily.py ${TOPIC:+--topic "$TOPIC"} ;;
          esac

      - name: 오늘 기록 저장
        # 중간에 멈춰도(크레딧 부족 등) 이미 만든 것은 저장한다
        if: always() && github.event_name != 'push' && inputs.mode != 'build' && inputs.mode != 'webtoontest' && inputs.mode != 'charsheet' && inputs.mode != 'scripttest'
        run: |
          git config user.name "sudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news data/webtoons data/webtoons.json data/reference
          if ! git diff --cached --quiet; then
            git commit -m "수달일보 $(TZ=Asia/Seoul date +%F) 발행"
            git pull --rebase
            git push
          fi

      - name: 검수 전 웹툰 시안 보관 (실패 원인 확인용)
        if: always() && hashFiles('data/drafts/*.jpg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-drafts
          path: data/drafts/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
