name: 수달일보 아침 메일·카톡

on:
  workflow_run:  # 발행이 끝나면 바로 보낸다 (GitHub 예약은 자주 늦거나 빠져서 이게 주 경로)
    workflows: ["수달일보 발행"]
    types: [completed]
  schedule:  # 예비용 (9시 이후). 하루 한 번만 보낸다
    - cron: "3 0 * * *"    # 09:03 (한국 시간)
    - cron: "33 0 * * *"   # 09:33
    - cron: "23 1 * * *"   # 10:23 (이때까지 오늘 호가 없으면 "아직 발행 안 됨" 메일)
    - cron: "23 3 * * *"   # 12:23 (웹툰이 이때까지 안 됐으면 운영자에게만 알림 메일)
  workflow_dispatch:       # Actions 탭에서 바로 보내 보기 (몇 번이든 보냄)

env:  # 예약 발행 뒤나 예비 예약이면 9시에 하루 한 번만, 손으로 다시 만든 뒤(수동 발행)나 수동 실행이면 바로 새로 보낸다
  ONCE: ${{ (github.event_name == 'schedule' || github.event.workflow_run.event == 'schedule') && '--once' || '' }}

permissions:
  contents: write

concurrency:
  group: mail
  cancel-in-progress: false

jobs:
  mail:
    # 디자인·코드 변경(push)으로 페이지만 다시 만든 경우와 발행 실패는 보내지 않는다
    # 손으로 돌린 시험·페이지 재생성(build, castsheet, charsheet, webtoontest) 뒤에도 보내지 않는다
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.event != 'push' && github.event.workflow_run.conclusion == 'success'
        && !endsWith(github.event.workflow_run.display_title, '· build')
        && !endsWith(github.event.workflow_run.display_title, '· castsheet')
        && !endsWith(github.event.workflow_run.display_title, '· charsheet')
        && !endsWith(github.event.workflow_run.display_title, '· redraw')
        && !endsWith(github.event.workflow_run.display_title, '· scripttest')
        && !endsWith(github.event.workflow_run.display_title, '· blogtest')
        && !endsWith(github.event.workflow_run.display_title, '· webtoontest'))
    runs-on: ubuntu-latest
    timeout-minutes: 340  # 새벽 발행 뒤 9시까지 기다리는 시간 포함 (GitHub 한도 6시간)
    steps:
      - name: 오전 9시까지 기다리기 (예약 발행 뒤에만)
        if: env.ONCE != ''
        run: |
          now=$(date +%s)
          nine=$(date -u -d "$(date -u -d "+9 hours" +%F) 00:00" +%s)  # 한국 날짜의 오전 9시 = UTC 00:00
          if [ "$now" -lt "$nine" ]; then
            echo "오전 9시까지 $(( (nine - now) / 60 ))분 기다립니다."
            sleep $(( nine - now ))
          fi

      - uses: actions/checkout@v5  # 기다린 뒤에 받아서 9시 기준 최신 묶음을 보낸다

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 오늘 게시글 메일 보내기
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        run: python mail_today.py $ONCE

      - run: pip install cryptography

      - name: 오늘 게시글 카카오톡(나와의 채팅)으로 보내기
        if: always()  # 메일이 실패해도 카톡은 보낸다
        continue-on-error: true  # 카톡이 실패해도 메일 기록은 남긴다
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_TOKEN_KEY: ${{ secrets.KAKAO_TOKEN_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python kakao_send.py $ONCE

      - name: 보낸 기록 저장
        if: always()
        run: |
          git config user.name "sudal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data/mailed data/kakaoed data/kakao_token.enc; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "아침 메일·카톡 $(TZ=Asia/Seoul date +%F) 발송 기록"
            git pull --rebase
            git push
          fi
